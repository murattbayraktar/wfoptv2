data:
  date_formats: ["%Y-%m-%d", "%d.%m.%Y", "%d/%m/%Y", "%Y%m%d"]
  working_hours: [7, 18]
  # Bu eşiğin altındaki eğitim verisiyle (auto modda) yalnızca holt_winters/ridge
  # denenir; XGBoost/LightGBM gibi modeller es geçilir (bkz. ModelSelector.select_best).
  min_training_days: 14

features:
  lag_days_daily: [1, 2, 3, 5, 7, 14, 21, 28]
  lag_hours_hourly: [1, 2, 3, 24, 48, 168]
  rolling_windows_daily: [7, 14, 30]
  fourier_weekly_terms: 3
  fourier_yearly_terms: 5

models:
  cv_folds: 5
  cv_metric: rmse
  random_state: 42
  n_jobs: -1
  xgboost_n_iter: 30
  lightgbm_n_iter: 30
  rf_n_iter: 20
  # Eğitim işçi havuzu (ProcessPoolExecutor) için elle üst sınır — null bırakılırsa
  # cgroup CPU kotası ve bellek limitine göre otomatik hesaplanır.
  # Ortam değişkeni MAX_TRAIN_WORKERS bu değerin önüne geçer.
  max_workers: null
  # Süreç başına tahmini bellek kullanımı (MB) — pandas/numpy/xgboost/lightgbm import
  # baseline'ı temkinli üst sınır alınarak belirlendi (bellek bazlı işçi sınırı buna göre hesaplanır).
  est_worker_memory_mb: 400
  # Saatlik veri günlüğe göre ~10x daha fazla satır içerir (her model.fit() orantısız
  # pahalıdır). Bu blok yalnızca freq == "hourly" olduğunda yukarıdaki değerlerin
  # üzerine uygulanır — kaldırılırsa/boş bırakılırsa davranış değişmez.
  hourly_overrides:
    cv_folds: 3
    xgboost_n_iter: 15
    lightgbm_n_iter: 15
    rf_n_iter: 10

forecast:
  confidence_method: quantile
  confidence_level: 0.80
  max_horizon_daily: 90
  max_horizon_hourly: 30

output:
  float_precision: 1
  include_feature_importance: true
